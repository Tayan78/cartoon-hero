<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Loppisskannern</title>
  <meta name="theme-color" content="#14181f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Loppis">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <h1>Loppisskannern</h1>
    <button id="btn-settings" class="icon-btn" aria-label="Inställningar">⚙︎</button>
  </header>

  <main>
    <!-- Skanna -->
    <section id="view-scan" class="view">
      <label class="camera" id="camera-label">
        <input id="photo" type="file" accept="image/*" capture="environment" hidden>
        <img id="preview" alt="" hidden>
        <span id="camera-text" class="camera-text">📷<br>Fota föremål</span>
      </label>

      <div id="angles" class="angles" hidden>
        <div id="angle-list" class="angle-list"></div>
        <label id="add-angle" class="add-angle">
          <input id="photo-more" type="file" accept="image/*" capture="environment" hidden>
          <span id="add-angle-text">+ Vinkel</span>
        </label>
      </div>

      <label class="field">
        <span>Inköpspris (valfritt)</span>
        <input id="buy-price" type="number" inputmode="numeric" pattern="[0-9]*" min="0" placeholder="kr">
      </label>

      <button id="btn-scan" class="primary big" disabled>Skanna</button>
      <p id="scan-hint" class="hint"></p>
    </section>

    <!-- Resultat -->
    <section id="view-result" class="view" hidden>
      <div id="status" class="status"><span class="spinner"></span><span id="status-text">Identifierar…</span></div>

      <article id="card" class="card">
        <div class="card-head">
          <img id="card-img" class="thumb" alt="">
          <div>
            <h2 id="r-name">…</h2>
            <p id="r-sub" class="muted"></p>
          </div>
        </div>

        <div id="r-main" class="main-row" hidden>
          <div>
            <div class="label">Median</div>
            <div id="r-median" class="median"></div>
            <div id="r-range" class="muted"></div>
          </div>
          <div id="r-score" class="score"><span id="r-score-num"></span><small>%</small></div>
        </div>
        <div id="r-verdict" class="verdict" hidden></div>
        <p id="r-reason" class="reason"></p>
        <p id="r-evidence" class="muted small"></p>
        <ul id="r-flags" class="flags"></ul>

        <dl id="r-details" class="details" hidden></dl>

        <h3 id="r-sources-title" hidden>Källor</h3>
        <ul id="r-sources" class="sources"></ul>

        <p id="r-cost" class="muted small"></p>
      </article>

      <div class="actions">
        <button id="btn-save" class="primary big" hidden>Spara till lager</button>
        <button id="btn-new" class="secondary big">Ny skanning</button>
      </div>
    </section>

    <!-- Inställningar -->
    <section id="view-settings" class="view" hidden>
      <h2>Inställningar</h2>
      <label class="field">
        <span>Lösenord (APP_TOKEN)</span>
        <input id="s-token" type="password" autocomplete="current-password">
      </label>
      <button id="btn-test" class="secondary">Testa anslutning</button>
      <p id="s-test" class="hint"></p>

      <h3>Modeller</h3>
      <label class="field">
        <span>Identifiering (ser bilderna)</span>
        <select id="s-model-id"></select>
      </label>
      <label class="field">
        <span>Prissökning (söker Tradera/eBay)</span>
        <select id="s-model-search"></select>
      </label>
      <label class="check">
        <input id="s-vision" type="checkbox">
        <span>Använd Googles bildsök</span>
      </label>

      <h3>Avgifter och frakt per plattform</h3>
      <p class="hint">Frakt = det du själv står för (emballage, frakt som inte betalas av köparen).</p>
      <table class="fees">
        <thead><tr><th></th><th>Avgift %</th><th>Fast kr</th><th>Frakt kr</th></tr></thead>
        <tbody id="s-fees"></tbody>
      </table>

      <h3>Växelkurser (eBay → SEK)</h3>
      <div id="s-fx" class="fx"></div>

      <p id="s-costs" class="hint"></p>

      <div class="actions">
        <button id="btn-settings-save" class="primary big">Spara</button>
        <button id="btn-settings-close" class="secondary big">Tillbaka</button>
      </div>
    </section>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>

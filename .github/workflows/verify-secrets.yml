# Kontrollerar att hemligheterna i GitHub är rätt – utan att visa dem.
# Körs manuellt (Actions → Kontrollera hemligheter → Run workflow) och när
# den här filen ändras.
name: Kontrollera hemligheter

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-secrets.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_URL: https://cartoon-hero-theta.vercel.app
      APP_TOKEN: ${{ secrets.APP_TOKEN }}
      TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID }}
      TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Kontrollera
        run: |
          fail=0
          check() { # namn, ok (1/0), detalj
            if [ "$2" = 1 ]; then echo "✓ $1"; else echo "✗ $1: $3"; fail=1; fi
          }
          missing() { [ -z "$1" ]; }

          # APP_TOKEN: appens anslutningstest svarar 200 med rätt lösenord, 401 med fel.
          if missing "$APP_TOKEN"; then check APP_TOKEN 0 "saknas i GitHub"; else
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "x-app-token: $APP_TOKEN" "$APP_URL/api/ping")
            [ "$code" = 200 ] && check APP_TOKEN 1 || check APP_TOKEN 0 "appen svarade $code (401 = fel lösenord)"
          fi

          # Tradera: en sökning svarar 200 med rätt nycklar.
          if missing "$TRADERA_APP_ID" || missing "$TRADERA_APP_KEY"; then check "TRADERA_APP_ID/KEY" 0 "saknas i GitHub"; else
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "X-App-Id: $TRADERA_APP_ID" -H "X-App-Key: $TRADERA_APP_KEY" "https://api.tradera.com/v4/search?query=schleich")
            [ "$code" = 200 ] && check "TRADERA_APP_ID/KEY" 1 || check "TRADERA_APP_ID/KEY" 0 "Tradera svarade $code (401 = fel nycklar)"
          fi

          # Cloudflare: token giltig, och kontot nåbart med den.
          if missing "$CLOUDFLARE_API_TOKEN"; then check CLOUDFLARE_API_TOKEN 0 "saknas i GitHub"; else
            ok=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/user/tokens/verify | grep -c '"status":"active"')
            [ "$ok" -ge 1 ] && check CLOUDFLARE_API_TOKEN 1 || check CLOUDFLARE_API_TOKEN 0 "token ogiltig eller inte aktiv"
          fi
          if missing "$CLOUDFLARE_ACCOUNT_ID"; then check CLOUDFLARE_ACCOUNT_ID 0 "saknas i GitHub"; else
            ok=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" | grep -c '"success":true')
            [ "$ok" -ge 1 ] && check CLOUDFLARE_ACCOUNT_ID 1 || check CLOUDFLARE_ACCOUNT_ID 0 "kontot hittades inte, eller token saknar behörighet till Workers"
          fi
          exit $fail

# Deployar bevakningen (worker/) till Cloudflare när den eller lib/ ändras på master.
# Hemligheterna kommer från GitHub (Settings → Secrets and variables → Actions).
name: Deploya bevakningen

on:
  push:
    branches: [master]
    paths:
      - worker/**
      - lib/**
      - .github/workflows/deploy-watcher.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-watcher
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Testerna först: en trasig ändring i lib/ ska inte nå bevakningen.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.150.0"
          workingDirectory: worker
          secrets: |
            TRADERA_APP_ID
            TRADERA_APP_KEY
            APP_TOKEN
            NTFY_TOPIC
        env:
          TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID }}
          TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      # Valfria hemligheter läggs bara in om de finns i GitHub:
      # TELEGRAM_BOT_TOKEN (från @BotFather) – notiserna går då via Telegram.
      # NTFY_TOKEN (ntfy.sh → Access tokens) – ntfy räknar då gränser per konto, inte per delad IP.
      - name: Valfria hemligheter
        if: env.TELEGRAM_BOT_TOKEN != '' || env.NTFY_TOKEN != ''
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          for name in TELEGRAM_BOT_TOKEN NTFY_TOKEN; do
            if [ -n "${!name}" ]; then printf '%s' "${!name}" | npx --yes wrangler@4.150.0 secret put "$name"; fi
          done
